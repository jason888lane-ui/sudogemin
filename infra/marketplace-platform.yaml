AWSTemplateFormatVersion: "2010-09-09"
Description: Sudogemini governed ingestion, agent jobs, and marketplace supporting resources.
Parameters:
  TaskRoleName:
    Type: String
    Description: Existing ECS task role name used by the Sudogemini API and worker.
  DatasetsTableArn:
    Type: String
    Description: ARN of the existing tenant-partitioned datasets DynamoDB table.
  TradesTableArn:
    Type: String
    Description: ARN of the existing tenant-partitioned trades DynamoDB table.
  AppOrigin:
    Type: String
    Default: https://app.sudogemini.com
    Description: Exact HTTPS origin allowed to upload directly to the private S3 bucket.
  StagingRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 2555
  WorkerImageUri:
    Type: String
    Description: Immutable ECR image URI built from the approved release commit.
  WorkerExecutionRoleArn:
    Type: String
    Description: Existing ECS task execution role ARN.
  WorkerClusterArn:
    Type: String
    Description: Existing ECS cluster ARN.
  WorkerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the isolated Fargate worker service.
  WorkerSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups allowing outbound access to SQS, S3, DynamoDB and Bedrock.
  DatasetsTableName:
    Type: String
    Description: Name of the existing tenant-partitioned datasets table.
  BedrockModelId:
    Type: String
    Description: Model or inference profile ID verified with Converse in this AWS account.
  WorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5
    Description: Keep at zero until image, model access, network egress and cost are approved.
  WorkerAssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
Resources:
  IngestionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AppOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: [Content-Type, x-amz-server-side-encryption]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStagedUploads
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: !Ref StagingRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PlatformJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 3600
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 4
  AgentJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: job_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  TenantMembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: member_sub
          AttributeType: S
      KeySchema:
        - AttributeName: member_sub
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  MarketplaceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listing_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at_listing_id
          AttributeType: S
      KeySchema:
        - AttributeName: listing_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-created-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at_listing_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  StripeEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: subscription_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: subscription-id-index
          KeySchema:
            - AttributeName: subscription_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ecs/sudogemini-worker
      RetentionInDays: 30
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sudogemini-worker
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref WorkerExecutionRoleArn
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${TaskRoleName}"
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImageUri
          Essential: true
          Command: ["python", "worker.py"]
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DATASETS_TABLE
              Value: !Ref DatasetsTableName
            - Name: INGESTION_BUCKET
              Value: !Ref IngestionBucket
            - Name: PLATFORM_JOBS_QUEUE_URL
              Value: !Ref PlatformJobsQueue
            - Name: AGENT_JOBS_TABLE
              Value: !Ref AgentJobsTable
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: WorkerTaskDefinition
    Properties:
      ServiceName: sudogemini-worker
      Cluster: !Ref WorkerClusterArn
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref WorkerTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref WorkerAssignPublicIp
          Subnets: !Ref WorkerSubnetIds
          SecurityGroups: !Ref WorkerSecurityGroupIds
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
  SudogeminiPlatformTaskPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SudogeminiPlatformRuntime
      Roles: [!Ref TaskRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:PutObject]
            Resource: !Sub "${IngestionBucket.Arn}/incoming/*"
          - Effect: Allow
            Action: [s3:GetObject, s3:DeleteObject]
            Resource: !Sub "${IngestionBucket.Arn}/incoming/*"
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub "${IngestionBucket.Arn}/datasets/*"
          - Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt PlatformJobsQueue.Arn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
            Resource: !Ref DatasetsTableArn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
            Resource: !Ref TradesTableArn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
            Resource:
              - !GetAtt AgentJobsTable.Arn
              - !GetAtt MarketplaceTable.Arn
              - !GetAtt StripeEventsTable.Arn
              - !GetAtt SubscriptionsTable.Arn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
            Resource: !GetAtt TenantMembershipsTable.Arn
          - Effect: Allow
            Action: [dynamodb:Query]
            Resource:
              - !Sub "${MarketplaceTable.Arn}/index/status-created-index"
              - !Sub "${SubscriptionsTable.Arn}/index/subscription-id-index"
          - Effect: Allow
            Action: [bedrock:InvokeModel]
            Resource: "*"
Outputs:
  IngestionBucketName:
    Value: !Ref IngestionBucket
  PlatformJobsQueueUrl:
    Value: !Ref PlatformJobsQueue
  AgentJobsTableName:
    Value: !Ref AgentJobsTable
  TenantMembershipsTableName:
    Value: !Ref TenantMembershipsTable
  MarketplaceTableName:
    Value: !Ref MarketplaceTable
  StripeEventsTableName:
    Value: !Ref StripeEventsTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
