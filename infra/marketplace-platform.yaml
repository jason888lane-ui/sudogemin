AWSTemplateFormatVersion: "2010-09-09"
Description: Sudogemini governed ingestion, agent jobs, and marketplace supporting resources.
Parameters:
  TaskRoleName:
    Type: String
    Description: Existing ECS task role name used by the Sudogemini API and worker.
  AppOrigin:
    Type: String
    Default: https://app.sudogemini.com
    Description: Exact HTTPS origin allowed to upload directly to the private S3 bucket.
  DataRetentionDays:
    Type: Number
    Default: 365
    MinValue: 30
    MaxValue: 2555
Resources:
  IngestionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AppOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: [Content-Type, x-amz-server-side-encryption]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStagedUploads
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: !Ref DataRetentionDays
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PlatformJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 240
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 4
  AgentJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: job_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  MarketplaceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at_listing_id
          AttributeType: S
      KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: created_at_listing_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  StripeEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: subscription_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: subscription-id-index
          KeySchema:
            - AttributeName: subscription_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  SudogeminiPlatformTaskPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SudogeminiPlatformRuntime
      Roles: [!Ref TaskRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:PutObject]
            Resource: !Sub "\${IngestionBucket.Arn}/incoming/*"
          - Effect: Allow
            Action: [s3:GetObject, s3:DeleteObject]
            Resource: !Sub "\${IngestionBucket.Arn}/incoming/*"
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
            Resource: !Sub "\${IngestionBucket.Arn}/datasets/*"
          - Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt PlatformJobsQueue.Arn
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
            Resource:
              - !GetAtt AgentJobsTable.Arn
              - !GetAtt MarketplaceTable.Arn
              - !GetAtt StripeEventsTable.Arn
              - !GetAtt SubscriptionsTable.Arn
              - !Sub "${SubscriptionsTable.Arn}/index/*"
          - Effect: Allow
            Action: [bedrock:InvokeModel]
            Resource: "*"
Outputs:
  IngestionBucketName:
    Value: !Ref IngestionBucket
  PlatformJobsQueueUrl:
    Value: !Ref PlatformJobsQueue
  AgentJobsTableName:
    Value: !Ref AgentJobsTable
  MarketplaceTableName:
    Value: !Ref MarketplaceTable
  StripeEventsTableName:
    Value: !Ref StripeEventsTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
