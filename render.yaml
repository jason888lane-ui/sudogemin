services:
  - type: web
    name: sudogemini
    runtime: python
    plan: free
    region: virginia
    branch: render-platform-fix
    rootDir: backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
