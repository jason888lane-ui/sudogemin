name: API CI

on:
  push:
    branches: [production-hardening]
    paths:
      - "backend/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [production-hardening]
    paths:
      - "backend/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Diagnose public DNS delegation (non-blocking)
        run: |
          curl -fsS 'https://dns.google/resolve?name=sudogemini.com&type=NS' || true
          echo
          curl -fsS 'https://dns.google/resolve?name=app.sudogemini.com&type=CNAME' || true
          echo
          curl -sS -i 'https://rdap.verisign.com/com/v1/domain/sudogemini.com' | head -c 5000 || true
          echo
      - name: Compile application
        run: python -m compileall -q main.py personal_intelligence.py platform_engine.py worker.py tests
      - name: Validate CloudFormation template
        run: |
          python -m pip install cfn-lint
          cfn-lint ../../infra/marketplace-platform.yaml
      - name: Run API security and readiness tests
        run: python -m unittest discover -s tests -v
