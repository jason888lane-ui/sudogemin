name: Application CI

on:
  push:
    branches: [main, production-hardening-2026-11-16, feature/customer-portal-agent-foundation]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile API and migrations
        run: python -m compileall -q main.py migrations
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser application syntax
        run: |
          node --check frontend/app.js
          node --check src/index.js
      - name: Verify static application assets
        run: |
          test -s frontend/index.html
          test -s frontend/config.js
          test -s frontend/styles.css
          test -s frontend/README.md
          grep -q 'Authorization Code flow with PKCE' frontend/README.md
          grep -q 'execution_enabled' frontend/app.js
